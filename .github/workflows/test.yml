name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub's hosted Linux runners are all Ubuntu VMs; the host is not
    # ours to choose. The job runs in a Fedora container, so the
    # interpreters and tools under test come from signed Fedora RPMs.
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:43
    strategy:
      matrix:
        # Oldest supported (pyproject requires-python) and newest.
        # Fedora packages both: python3.10 alongside, 3.14 as python3.
        python-version: ["3.10", "3.14"]
    steps:
      # Before checkout: without git, actions/checkout fetches a
      # tarball with no .git, and test.sh relies on `git grep`. The
      # sync tests drive real rclone against local directories;
      # without it they skip, and the mirror-safety contract goes
      # untested.
      - name: Install system packages
        run: >-
          dnf install -y -q git-core rclone
          python${{ matrix.python-version }}
      # Actions are pinned by commit SHA: a moved tag cannot change
      # what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: |
          python${{ matrix.python-version }} -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
      # test.sh needs no private data: it points every run at a fresh
      # empty workspace.
      - name: Lint and test
        run: ./test.sh
