name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (pyproject requires-python) and newest.
        python-version: ["3.10", "3.14"]
    steps:
      # Actions are pinned by commit SHA: a moved tag cannot change
      # what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
      # test.sh needs no private data: it points every run at a fresh
      # empty workspace.
      - name: Lint and test
        run: ./test.sh
