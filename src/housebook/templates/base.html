<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Housebook{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="/static/vendor/vue.global.prod.js"></script>
    {% block head_extra %}{% endblock %}
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background: #f8fafc; overflow-x: hidden; }
        [v-cloak] { display: none; }
        .chart-container { position: relative; height: 280px; }
        .panel-slide-enter-active, .panel-slide-leave-active { transition: transform 0.25s ease; }
        .panel-slide-enter-from, .panel-slide-leave-to { transform: translateX(100%); }
        .modal-fade-enter-active, .modal-fade-leave-active { transition: opacity 0.15s ease; }
        .modal-fade-enter-from, .modal-fade-leave-to { opacity: 0; }
        thead th { position: sticky; top: 0; z-index: 2; }
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Help drawer: a native <dialog> pinned to the right edge that
           slides in on open and back out before it closes. */
        #help-drawer { margin: 0 0 0 auto; padding: 0; border: 0; height: 100dvh; max-height: none;
                       width: min(30rem, 100vw); max-width: none; box-shadow: -8px 0 24px rgb(15 23 42 / 0.12); }
        #help-drawer::backdrop { background: rgb(15 23 42 / 0.25); }
        #help-drawer[open] { animation: help-slide-in 0.25s ease-out; }
        #help-drawer[open]::backdrop { animation: help-fade-in 0.25s ease-out; }
        #help-drawer.closing { animation: help-slide-out 0.2s ease-in forwards; }
        #help-drawer.closing::backdrop { animation: help-fade-out 0.2s ease-in forwards; }
        @keyframes help-slide-in { from { transform: translateX(100%); } }
        @keyframes help-slide-out { to { transform: translateX(100%); } }
        @keyframes help-fade-in { from { opacity: 0; } }
        @keyframes help-fade-out { to { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
            #help-drawer[open], #help-drawer.closing,
            #help-drawer[open]::backdrop, #help-drawer.closing::backdrop { animation: none; }
        }
        .help-section { padding-top: 1.25rem; }
        .help-section + .help-section { margin-top: 1.25rem; border-top: 1px solid #f3f4f6; }
        .help-section h2 { font-size: 1.05rem; font-weight: 800; color: #111827; }
        .help-section h3 { font-size: 0.875rem; font-weight: 700; color: #1f2937; margin-top: 1rem; }
        .help-section p, .help-section li { font-size: 0.875rem; line-height: 1.6; color: #4b5563; }
        .help-section p + p, .help-section p + ul, .help-section ul + p { margin-top: 0.75rem; }
        .help-section ul { list-style: disc; padding-left: 1.25rem; margin-top: 0.5rem; }
        .help-section li + li { margin-top: 0.25rem; }
        .help-section strong { color: #1f2937; }
        .help-section code { font-size: 0.8rem; background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 0.25rem; }
        {% block style_extra %}{% endblock %}
    </style>
</head>
<body class="min-h-screen pb-12">
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:bg-white focus:px-3 focus:py-2 focus:rounded-lg focus:shadow-lg">
        Skip to main content
    </a>
    <!-- STATIC HEADER (outside Vue — always visible) -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-w-0">
            <!-- Row 1: Logo + Module Nav + Actions -->
            <div class="py-3 flex items-center justify-between gap-2 min-w-0">
                <h1 aria-label="Housebook" class="text-xl font-extrabold text-gray-900 flex items-center shrink-0">
                    <span class="bg-blue-600 text-white p-1.5 rounded-lg mr-2">
                        <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </span>
                    <span class="hidden sm:inline">Housebook</span>
                </h1>
                <div class="flex items-center gap-3 min-w-0">
                    <nav aria-label="Primary" class="flex bg-gray-100 p-1 rounded-xl border border-gray-200 overflow-x-auto no-scrollbar">
                        <a href="/spending"
                           {% if active_module == 'spending' %}aria-current="page"{% endif %}
                           class="px-2.5 sm:px-4 py-1.5 rounded-lg text-sm font-bold whitespace-nowrap transition-all {% if active_module == 'spending' %}bg-white text-blue-600 shadow-sm{% else %}text-gray-500 hover:text-gray-700{% endif %}">
                            Spending
                        </a>
                        <a href="/tax"
                           {% if active_module == 'tax' %}aria-current="page"{% endif %}
                           class="px-2.5 sm:px-4 py-1.5 rounded-lg text-sm font-bold whitespace-nowrap transition-all {% if active_module == 'tax' %}bg-white text-blue-600 shadow-sm{% else %}text-gray-500 hover:text-gray-700{% endif %}">
                            Income & Tax
                        </a>
                        <a href="/hsa"
                           {% if active_module == 'hsa' %}aria-current="page"{% endif %}
                           class="px-2.5 sm:px-4 py-1.5 rounded-lg text-sm font-bold whitespace-nowrap transition-all {% if active_module == 'hsa' %}bg-white text-blue-600 shadow-sm{% else %}text-gray-500 hover:text-gray-700{% endif %}">
                            HSA Shoebox
                        </a>
                    </nav>
                    <button type="button" id="help-open"
                            data-help-topic="{{ help_topic | default(active_module) }}"
                            aria-haspopup="dialog" aria-controls="help-drawer"
                            title="What each page is for" aria-label="Help"
                            class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-sm font-bold whitespace-nowrap transition-all shrink-0 text-gray-500 hover:text-gray-700">
                        <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span aria-hidden="true" class="hidden sm:inline">Help</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="app-error" role="alert" hidden
         class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] w-[calc(100%-2rem)] max-w-xl bg-red-50 text-red-800 border border-red-200 rounded-xl shadow-lg px-4 py-3">
        <div class="flex items-start gap-3">
            <p id="app-error-message" class="text-sm font-semibold flex-1"></p>
            <button type="button" aria-label="Dismiss error" onclick="hideAppError()"
                    class="text-red-500 hover:text-red-700 font-bold">&times;</button>
        </div>
    </div>

    <!-- VUE APP (dynamic content) -->
{% raw %}
    <div id="app" v-cloak>
        <!-- Sub-header (date controls, filters — Vue-driven) -->
        <div class="bg-white border-b border-gray-100 sticky top-[57px] z-10 min-w-0">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-w-0">
                {% endraw %}{% block header_rows %}{% endblock %}{% raw %}
            </div>
        </div>

        <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 min-w-0">
            <!-- Loading -->
            <div v-if="loading" role="status" class="flex justify-center py-20">
                <div aria-hidden="true" class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                <span class="sr-only">Loading dashboard</span>
            </div>

            <template v-else>
                {% endraw %}{% block content %}{% endblock %}{% raw %}
            </template>
        </main>

        {% endraw %}{% block overlays %}{% endblock %}{% raw %}
    </div>
{% endraw %}

    {% include "_help_drawer.html" %}

    <script>
        const CHART_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#84cc16', '#6366f1', '#14b8a6', '#e11d48', '#a855f7', '#0ea5e9', '#d97706', '#64748b'];
        const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

        const hideAppError = () => {
            document.getElementById('app-error').hidden = true;
        };

        const showAppError = (message) => {
            document.getElementById('app-error-message').textContent = message;
            document.getElementById('app-error').hidden = false;
        };

        const apiFetch = async (url, options = {}) => {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    let detail = `Request failed (${response.status})`;
                    try {
                        const body = await response.clone().json();
                        if (body.detail) {
                            detail = typeof body.detail === 'string'
                                ? body.detail
                                : JSON.stringify(body.detail);
                        }
                    } catch (_) {
                        // The status code remains actionable when the body
                        // is not JSON (for example, proxy-generated errors).
                    }
                    throw new Error(detail);
                }
                return response;
            } catch (error) {
                showAppError(error.message || 'The request could not be completed.');
                throw error;
            }
        };
        // Help drawer. Plain JS rather than Vue: every page shares it,
        // while each page mounts its own Vue app.
        (() => {
            const drawer = document.getElementById('help-drawer');
            const opener = document.getElementById('help-open');
            const scroller = document.getElementById('help-drawer-scroll');

            const goTo = (topic, behavior) => {
                const section = document.getElementById('help-' + topic);
                if (section) scroller.scrollTo({ top: section.offsetTop, behavior });
            };
            const close = () => {
                if (!drawer.open || drawer.classList.contains('closing')) return;
                drawer.classList.add('closing');
                const done = () => {
                    drawer.classList.remove('closing');
                    drawer.close();
                };
                // Reduced motion disables the animation, so no animationend.
                if (getComputedStyle(drawer).animationName === 'none') done();
                else drawer.addEventListener('animationend', done, { once: true });
            };

            opener.addEventListener('click', () => {
                drawer.showModal();
                goTo(opener.dataset.helpTopic, 'instant');
            });
            drawer.addEventListener('cancel', (event) => {
                event.preventDefault();  // Escape: animate out instead
                close();
            });
            drawer.addEventListener('click', (event) => {
                if (event.target === drawer) close();  // the backdrop
                if (event.target.closest('[data-help-close]')) close();
                const topic = event.target.closest('[data-help-goto]');
                if (topic) goTo(topic.dataset.helpGoto, 'smooth');
            });
        })();

        {% block vue_app %}{% endblock %}
    </script>
</body>
</html>
